<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Busted | Enquiry</title>
</head>

<body>

    <header>

        <h1>Black Busted Enquiry</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section>

            <h2>Product Enquiry</h2>

            <p>
                Complete the form below if you have a question about one
                of our products.
            </p>

            <form action="#" method="post">

                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone">
                </p>

                <p>
                    <label for="product">Product:</label><br>

                    <select id="product" name="product" required>
                        <option value="">Select Product</option>
                        <option value="hoodie">Roses Hoodie</option>
                        <option value="tshirt">Lava edition T-Shirt</option>
                        <option value="trackpants">Trackpants</option>
                        <option value="hat">Sunpanel</option>
                    </select>
                </p>

                <p>
                    <label for="message">Message:</label><br>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        required>
                    </textarea>
                </p>

                <button type="submit">Submit Enquiry</button>
                <button type="reset">Clear Form</button>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 Black Busted</p>

    </footer>

</body>
